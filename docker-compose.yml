version: '3.8'
services:
  # 🛡️ 백엔드 API 서버 (오늘 완성한 index.js)
  nofake-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nofake-api-server
    ports:
      - "3001:3001"
    env_file:
      - .env #
    restart: always

  # 🌐 프론트엔드 및 Nginx (기존 설정 유지)
  raffle-web:
    build: .
    container_name: nofake-web-proxy
    ports:
      - "80:80"
    restart: always
